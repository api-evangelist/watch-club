name: Watch Club
description: 'Watch Club is a mobile streaming and social platform for young adults, built around
  original coming-of-age teen drama series that viewers watch and then discuss with other fans through
  polls, episode reactions, and community threads. Its first original series, RETURN OFFER, launches
  February 2026, with a slate of additional YA series in development. The app is available on iOS and is
  operated by Kino Technologies Inc. Watch Club is a GV (Google Ventures) portfolio company in the
  consumer sector; it publishes no public developer API surface as of this profile.'
